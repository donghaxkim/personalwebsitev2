<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RNN vs Transformer — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: rgba(255,255,255,0.85);
    font-family: 'Karla', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    max-width: 520px;
    width: 100%;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 28px 24px;
  }

  /* Header row */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  /* Toggle */
  .toggle {
    display: flex;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    cursor: pointer;
  }
  .toggle-option {
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.3);
    transition: all 0.25s ease;
    user-select: none;
  }
  .toggle-option.active {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.85);
    font-weight: 600;
  }

  /* Play button */
  .play-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s;
    background: none;
    outline: none;
  }
  .play-btn:hover {
    border-color: rgba(255,255,255,0.3);
  }
  .play-icon {
    width: 0; height: 0;
    border-left: 10px solid rgba(255,255,255,0.5);
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    margin-left: 2px;
    transition: border-left-color 0.2s;
  }
  .play-btn:hover .play-icon {
    border-left-color: rgba(255,255,255,0.7);
  }

  /* Sentence area */
  .sentence {
    position: relative;
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    min-height: 64px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .word {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 16px;
    font-family: 'Karla', sans-serif;
    border: 1px solid rgba(255,255,255,0.08);
    opacity: 0.5;
    transition: opacity 0.35s ease, font-weight 0.35s ease, border-color 0.35s ease;
    position: relative;
    z-index: 1;
  }

  /* SVG connections */
  .connections {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .connections line, .connections path {
    transition: opacity 0.3s ease;
  }

  /* Hidden state bar */
  .hidden-state {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
    height: 20px;
    overflow: hidden;
    transition: opacity 0.3s ease, height 0.3s ease;
  }
  .hidden-state.hidden {
    opacity: 0;
    height: 0;
    margin-bottom: 0;
  }
  .hidden-state-label {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .hidden-state-track {
    width: 120px;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }
  .hidden-state-fill {
    height: 100%;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
    width: 100%;
    transition: width 0.35s ease;
  }

  /* Caption */
  .caption {
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    line-height: 1.5;
    transition: opacity 0.3s ease;
    min-height: 20px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="toggle" id="toggle">
      <div class="toggle-option active" data-mode="rnn" onclick="setMode('rnn')">RNN</div>
      <div class="toggle-option" data-mode="transformer" onclick="setMode('transformer')">Transformer</div>
    </div>
    <button class="play-btn" onclick="play()" aria-label="Play animation">
      <div class="play-icon"></div>
    </button>
  </div>

  <div class="sentence" id="sentence">
    <svg class="connections" id="connections"></svg>
    <div class="word" data-index="0">the</div>
    <div class="word" data-index="1">cat</div>
    <div class="word" data-index="2">sat</div>
    <div class="word" data-index="3">on</div>
    <div class="word" data-index="4">the</div>
    <div class="word" data-index="5">mat</div>
  </div>

  <div class="hidden-state" id="hiddenState">
    <span class="hidden-state-label">hidden state</span>
    <div class="hidden-state-track">
      <div class="hidden-state-fill" id="hiddenStateFill"></div>
    </div>
  </div>

  <div class="caption" id="caption"></div>
</div>

<script>
  let mode = 'rnn'
  let animating = false
  let timeouts = []

  const words = document.querySelectorAll('.word')
  const caption = document.getElementById('caption')
  const hiddenState = document.getElementById('hiddenState')
  const hiddenStateFill = document.getElementById('hiddenStateFill')
  const svg = document.getElementById('connections')

  const RNN_OPACITIES = [0.08, 0.14, 0.25, 0.4, 0.6, 1.0]
  const TRANSFORMER_OPACITIES = [0.6, 1.0, 1.0, 0.6, 0.6, 1.0]
  const TRANSFORMER_BOLD = [false, true, true, false, false, true]

  // Connection definitions: [fromIndex, toIndex, strength]
  // strength: 'strong' | 'medium' | 'weak'
  const CONNECTIONS = [
    [1, 2, 'strong'],   // cat ↔ sat
    [2, 5, 'strong'],   // sat ↔ mat
    [1, 5, 'medium'],   // cat ↔ mat
    [0, 1, 'weak'],     // the ↔ cat
    [3, 4, 'weak'],     // on ↔ the
    [4, 5, 'weak'],     // the ↔ mat
  ]

  function setMode(m) {
    mode = m
    // Update toggle
    document.querySelectorAll('.toggle-option').forEach(el => {
      el.classList.toggle('active', el.dataset.mode === m)
    })
    reset()
    play()
  }

  function reset() {
    timeouts.forEach(t => clearTimeout(t))
    timeouts = []
    animating = false
    words.forEach(w => {
      w.style.opacity = '0.5'
      w.style.fontWeight = '400'
      w.style.borderColor = 'rgba(255,255,255,0.08)'
    })
    hiddenStateFill.style.width = '100%'
    svg.innerHTML = ''
    caption.style.opacity = '0'
  }

  function play() {
    reset()
    animating = true

    if (mode === 'rnn') {
      hiddenState.classList.remove('hidden')
      playRNN()
    } else {
      hiddenState.classList.add('hidden')
      playTransformer()
    }
  }

  function playRNN() {
    const delay = 400
    caption.textContent = 'processing word by word — earlier words fade from memory'

    // Fade in caption
    requestAnimationFrame(() => { caption.style.opacity = '1' })

    words.forEach((word, i) => {
      const t = setTimeout(() => {
        // Highlight current word
        word.style.opacity = '1'
        word.style.fontWeight = '600'
        word.style.borderColor = 'rgba(255,255,255,0.2)'

        // Fade previous words
        for (let j = 0; j < i; j++) {
          const prevOpacity = RNN_OPACITIES[j] + (RNN_OPACITIES[i] - RNN_OPACITIES[j]) * ((i - j) > 3 ? 0 : (3 - (i - j)) / 3)
          // Simpler: just set final opacities progressively
          words[j].style.opacity = String(RNN_OPACITIES[j] / RNN_OPACITIES[i] * 0.6)
          words[j].style.fontWeight = '400'
          words[j].style.borderColor = 'rgba(255,255,255,0.04)'
        }

        // Shrink hidden state
        const fill = 100 - (i / 5) * 80
        hiddenStateFill.style.width = fill + '%'

        // On last word, set final opacities
        if (i === 5) {
          setTimeout(() => {
            words.forEach((w, k) => {
              w.style.opacity = String(RNN_OPACITIES[k])
              w.style.fontWeight = k === 5 ? '600' : '400'
              w.style.borderColor = k === 5 ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.04)'
            })
            hiddenStateFill.style.width = '20%'
            animating = false
          }, 200)
        }
      }, delay * (i + 1))
      timeouts.push(t)
    })
  }

  function playTransformer() {
    caption.textContent = 'every word sees every other word — connections computed all at once'

    const t = setTimeout(() => {
      // All words light up at once
      words.forEach((word, i) => {
        word.style.opacity = String(TRANSFORMER_OPACITIES[i])
        word.style.fontWeight = TRANSFORMER_BOLD[i] ? '600' : '400'
        word.style.borderColor = TRANSFORMER_BOLD[i] ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)'
      })

      // Caption
      caption.style.opacity = '1'

      // Draw connection lines
      drawConnections()
      animating = false
    }, 150)
    timeouts.push(t)
  }

  function drawConnections() {
    svg.innerHTML = ''
    const sentenceRect = document.getElementById('sentence').getBoundingClientRect()

    CONNECTIONS.forEach(([from, to, strength]) => {
      const fromRect = words[from].getBoundingClientRect()
      const toRect = words[to].getBoundingClientRect()

      const x1 = fromRect.left + fromRect.width / 2 - sentenceRect.left
      const y1 = fromRect.top + fromRect.height / 2 - sentenceRect.top
      const x2 = toRect.left + toRect.width / 2 - sentenceRect.left
      const y2 = toRect.top + toRect.height / 2 - sentenceRect.top

      const strokeWidth = strength === 'strong' ? 1.5 : 1
      const opacity = strength === 'strong' ? 0.2 : strength === 'medium' ? 0.1 : 0.05

      if (strength === 'medium') {
        // Curved arc above
        const midX = (x1 + x2) / 2
        const midY = Math.min(y1, y2) - 30
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        path.setAttribute('d', `M ${x1} ${y1 - 16} Q ${midX} ${midY - 16} ${x2} ${y2 - 16}`)
        path.setAttribute('fill', 'none')
        path.setAttribute('stroke', `rgba(255,255,255,${opacity})`)
        path.setAttribute('stroke-width', strokeWidth)
        path.style.opacity = '0'
        svg.appendChild(path)
        requestAnimationFrame(() => { path.style.opacity = '1' })
      } else {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        line.setAttribute('x1', x1)
        line.setAttribute('y1', y1)
        line.setAttribute('x2', x2)
        line.setAttribute('y2', y2)
        line.setAttribute('stroke', `rgba(255,255,255,${opacity})`)
        line.setAttribute('stroke-width', strokeWidth)
        line.style.opacity = '0'
        svg.appendChild(line)
        requestAnimationFrame(() => { line.style.opacity = '1' })
      }
    })
  }
</script>

</body>
</html>
